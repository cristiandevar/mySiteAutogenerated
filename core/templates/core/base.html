{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Administración{% endblock %} · MiSitio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/estilos.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:producto_lista' %}">MiSitio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'core:producto_lista' %}">Productos</a>
                    <a class="nav-link" href="{% url 'core:categoria_lista' %}">Categorías</a>
                    <a class="nav-link" href="{% url 'core:marca_lista' %}">Marcas</a>
                    <a class="nav-link" href="{% url 'core:proveedor_lista' %}">Proveedores</a>
                    <a class="nav-link" href="/admin/">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container text-center text-muted mb-4">
        <small>&copy; 2026 MiSitio — proyecto generado con Django + Bootstrap</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
