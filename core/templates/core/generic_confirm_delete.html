{% extends 'core/base.html' %}

{% block title %}Eliminar {{ titulo }}{% endblock %}

{% block content %}
  <h1 class="h3 mb-4">Eliminar {{ titulo }}</h1>

  <div class="card border-danger">
    <div class="card-body">
      <p>¿Estás seguro de que querés eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{{ volver_url }}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div>
  </div>
{% endblock %}
